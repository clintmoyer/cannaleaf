[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cannaleaf"
version = "0.1.0"
description = "A procedurally drawn, gently swaying cannabis leaf for your terminal"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.scripts]
cannaleaf = "cannaleaf.app:main"

[tool.setuptools.packages.find]
include = ["cannaleaf*"]
